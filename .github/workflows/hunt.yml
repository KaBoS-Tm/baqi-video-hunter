name: Baqi Video OSINT Hunter

on:
  workflow_dispatch: # للتشغيل اليدوي بضغطة زر متى شئت

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: سحب ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل محرك التنقيب العميق
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python hunter.py

      - name: حفظ تقرير النتائج في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.html results.json
          git diff --staged --quiet || git commit -m "تحديث نتائج التنقيب الآلي"
          git push
